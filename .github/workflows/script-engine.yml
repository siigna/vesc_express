# Checks for the Lua script engine and the shared script container.
#
# Everything here runs without hardware and without ESP-IDF, on purpose: the
# parts of a script engine that are worth automating are the ones that are
# pure logic over untrusted input, and those are exactly the parts that a
# board cannot help you test. The one job that does need a toolchain only
# compiles, and says so.

name: script engine

on:
  push:
    paths:
      - 'main/script/**'
      - 'main/lua/**'
      - 'main/display/ttf_font.*'
      - 'main/display/disp_backend.*'
      - 'tools/luapack.py'
      - 'tools/script_ext_coverage.py'
      - 'tests/**'
      - '.github/workflows/script-engine.yml'
  pull_request:
  workflow_dispatch:
  # For the provenance audit's full sweep; see that job.
  schedule:
    - cron: "43 4 * * 1"

jobs:
  # One job calling tests/check.sh, which is what a developer runs. The
  # previous version restated each command here, and they drifted: the
  # sanitizer guard grepped the Makefile for a string it had stopped
  # containing, so that job was red on every push while the 142 checks
  # underneath it passed. A workflow that repeats the commands is a second
  # copy of them.
  host-checks:
    name: host checks (asan, ubsan, packer, coverage, analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tools come from the flake, not apt, so CI runs the versions a
      # developer does. That is not tidiness: cppcheck 2.18 emits an
      # informational message about branch analysis that Ubuntu's 2.13 does
      # not, and --error-exitcode turns it into a failure -- so this job was
      # green on apt and red in the pinned shell, for a difference in the tool
      # rather than in the code.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # Separate so a cache miss or a broken flake reads as its own failure
      # rather than as a failing test.
      - name: Build the dev shell
        run: nix develop --command true

      # check.sh skips a tool that is absent rather than failing, so without
      # this the analysis stages could pass by not running.
      - name: Confirm the tools are present
        run: |
          nix develop --command bash -c 'command -v cppcheck && command -v clang-tidy'

      - run: nix develop --command ./tests/check.sh

  fuzz:
    name: fuzz the container parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      # Its own job because it is the slow one, and longer here than the 30s
      # default a developer gets.
      - run: nix develop --command ./tests/check.sh --fuzz-only --fuzz-secs=120
      - name: Keep any crash for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            main/script/test/crash-*
            main/script/test/timeout-*
            main/script/test/leak-*

  # The repl is a host build of LispBM, and two other repositories depend on
  # it: vesc_pkg's dash render tests and the lisp Garmr's engage checks both
  # run their lisp in it. Nothing here built it, and it had stopped linking --
  # src/extensions/ttf_extensions.c includes "ttf_font.h" and calls font_get_*,
  # which lispBM does not implement and the host application must, so a
  # subtree bump that started calling it left the repl with a wall of
  # undefined references. A job that builds it is how that gets noticed here
  # rather than in another repository.
  repl:
    name: build the lispBM repl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # readline and libpng come from the flake too, which is also how a
      # developer is told to build this -- see main/lispBM/repl's own
      # instructions and dash_common/test/README.md in vesc_pkg.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # The features vesc_pkg's dash tests ask for; see
      # dash_common/test/README.md there. 64 because the goldens were rendered
      # by a 64-bit build, clay because the screen descriptions need it.
      - name: Build
        run: nix develop --command make -C main/lispBM/repl FEATURES="64 clay"

      # Built is not the same as working, and the thing it has to do for its
      # dependents is evaluate a whole program and come back with an answer.
      - name: Evaluate a program with it
        run: |
          set -e
          cat > /tmp/smoke.lisp <<'LISP'
          (define total 0)
          (looprange i 0 10 (setq total (+ total i)))
          (print (str-merge "sum=" (to-str total)))
          (print (str-merge "trap=" (to-str (car (trap (car 1))))))
          LISP
          out=$(main/lispBM/repl/repl -H 400000 -M 8000000 --silent \
                --terminate -s /tmp/smoke.lisp 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" > /tmp/smoke.out
          grep -q 'sum=45' /tmp/smoke.out \
              || { echo "the repl did not evaluate the loop"; exit 1; }
          grep -q 'trap=exit-error' /tmp/smoke.out \
              || { echo "trap did not report an error"; exit 1; }

  both-engines:
    name: build both engines
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The real regression guard for the build-time swap: the same board
      # built each way, and both have to link. A lua build excludes 40-odd
      # files written against the LispBM ABI, so it is easy to break one while
      # working on the other.
      #
      # S3 N16R8 is chosen because its board file registers no script
      # extensions of its own, which is the current precondition for a lua
      # build. Boards with their own lisp glue need that glue ported first.
      - name: LispBM
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build_lisp -DSDKCONFIG=build_lisp/sdkconfig \
            -DIDF_TARGET=esp32s3 -DHW_NAME="S3 N16R8" build
      - name: Lua
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build_lua -DSDKCONFIG=build_lua/sdkconfig \
            -DIDF_TARGET=esp32s3 -DHW_NAME="S3 N16R8" -DSCRIPT_ENGINE=lua build
      # A lua build that still links LispBM would mean the exclusion silently
      # stopped working, which the size alone would not reveal.
      #
      # The symbol lists go to files first. `nm ... | grep -q` exits as soon
      # as grep finds a match, nm then dies on the closed pipe, and under the
      # -o pipefail this step runs with, the pipeline's status becomes 141 --
      # so this step failed with SIGPIPE and no message, having asserted
      # nothing, while both builds and the swap itself were fine.
      - name: Confirm the swap actually happened
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          set -e
          nm build_lua/vesc_express.elf > /tmp/lua_syms.txt
          nm build_lisp/vesc_express.elf > /tmp/lisp_syms.txt

          grep -q ' T lua_newstate' /tmp/lua_syms.txt \
              || { echo "the lua build has no interpreter"; exit 1; }
          if grep -qE ' T (lbm_add_extension|eval_cps_run)' /tmp/lua_syms.txt; then
            echo "LispBM symbols found in the lua build"; exit 1
          fi
          grep -q ' T lbm_add_extension' /tmp/lisp_syms.txt \
              || { echo "the lisp build has no LispBM"; exit 1; }
          if grep -q ' T lua_newstate' /tmp/lisp_syms.txt; then
            echo "Lua symbols found in the lisp build"; exit 1
          fi
          echo "  ok  each build carries one engine and not the other"
      # The panel drivers are shared between engines, with their LispBM
      # extension wrappers behind #if SCRIPT_ENGINE_LISP. Getting that guard
      # wrong compiles cleanly either way -- too wide and the lisp build
      # silently loses disp-cmd, too narrow and the lua build fails to
      # link -- so check the registered name is present in one binary and
      # absent from the other.
      - name: Confirm the driver guards are correct in both directions
        shell: bash
        run: |
          set -e
          # Strings to a file first, like the symbol lists above: a
          # `tr | grep -q` pipeline under pipefail can report 141 *after a
          # successful match*, because grep exits and tr takes SIGPIPE. Inside
          # `if ! present ...` that inverts the verdict rather than failing
          # the step, so the wrong answer would have been the quiet one.
          strings_of() { tr -c '[:print:]' '\n' < "$1" > /tmp/strings.txt; }
          present() { strings_of "$1"; grep -qx 'ext-disp-cmd' /tmp/strings.txt; }
          if ! present build_lisp/vesc_express.bin; then
            echo "lisp build lost ext-disp-cmd: the guard is too wide"; exit 1
          fi
          if present build_lua/vesc_express.bin; then
            echo "lua build contains ext-disp-cmd: the guard is too narrow"; exit 1
          fi
      # Touch is one driver core with two sets of bindings, so the same
      # mistake is possible there: the core must be in both binaries while
      # each engine's own binding names stay on their own side. A core that
      # fell out of the lua build would not fail to link -- the bindings
      # would simply be gone -- so check the symbol, not just the strings.
      - name: Confirm the touch core is shared and the bindings are not
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          set -e
          # Same reason as the step above: no pipeline whose left-hand side
          # can be killed by grep exiting early.
          sym() { nm "$1" > /tmp/nm.txt; grep -q " T touch_core_load_i2c" /tmp/nm.txt; }
          str() { tr -c '[:print:]' '\n' < "$1" > /tmp/str.txt; grep -qx "$2" /tmp/str.txt; }
          for b in build_lisp build_lua; do
            if ! sym "$b/vesc_express.elf"; then
              echo "$b has no touch core"; exit 1
            fi
          done
          if ! str build_lisp/vesc_express.bin 'touch-load-gt911'; then
            echo "lisp build lost touch-load-gt911"; exit 1
          fi
          if str build_lua/vesc_express.bin 'touch-load-gt911'; then
            echo "lua build has the lisp touch bindings"; exit 1
          fi
          if ! str build_lua/vesc_express.bin 'touch_load_cst9217'; then
            echo "lua build lost its touch bindings"; exit 1
          fi

  target-compile:
    name: compile for esp32s3
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      # Compile only, not a link: this proves the vendored Lua builds for
      # Xtensa with the patched luaconf.h, which is the part most likely to
      # break on a toolchain bump. Measured 90,638 B of flash when this was
      # written, against 86,974 B for the LispBM core it replaces.
      - name: Compile vendored Lua
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p /tmp/luaobj
          cd main/lua
          for f in *.c; do
            xtensa-esp32s3-elf-gcc -c -Os -I. -ffunction-sections -fdata-sections \
              -Werror -o "/tmp/luaobj/${f%.c}.o" "$f"
          done
          xtensa-esp32s3-elf-size -A /tmp/luaobj/*.o | \
            awk '/^\.text/{t+=$2} /^\.rodata/{r+=$2} END{printf "flash total: %d B\n", t+r}'

  # Who actually wrote the content of the files this fork adds. Every time
  # something has been lifted out of an upstream file, the new file has been
  # created with this fork's header and only this fork's name -- twenty-four
  # times across four repositories before anyone looked. This is the check
  # that stops that happening to a contribution.
  #
  # On a pull request it audits only the files that PR touches, which takes
  # seconds; the weekly run audits everything.
  provenance:
    name: provenance of added files
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      # blame -C follows lines copied between files, so it needs the history.
      # A shallow clone makes every line look like it originated here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The audit itself lives in the firmware tree, which is the one place it
      # is maintained. Allowed to fail, and the step after reports a skip
      # rather than a pass, because a check that silently did not run is the
      # failure mode this whole exercise was about.
      - name: Check out the audit
        id: tool
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: siigna/bldc
          path: bldc_tool
          sparse-checkout: tests/provenance

      - name: Fetch upstream to compare against
        run: |
          set -e
          url=https://github.com/vedderb/vesc_express
          git remote add upstream "$url" 2>/dev/null \
              || git remote set-url upstream "$url"
          git fetch --no-tags --quiet upstream main

      - name: Audit
        run: |
          set -e
          audit=bldc_tool/tests/provenance/audit.py

          if [ ! -f "$audit" ]; then
              echo "  skipped: could not check out the audit from siigna/bldc"
              exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags --quiet origin "$GITHUB_BASE_REF"
              mapfile -t files < <(git diff --name-only \
                  "origin/$GITHUB_BASE_REF...HEAD")
              printf '%s file(s) changed by this pull request\n' "${#files[@]}"
              python3 "$audit" . upstream/main "${files[@]}"
          else
              python3 "$audit" . upstream/main
          fi
